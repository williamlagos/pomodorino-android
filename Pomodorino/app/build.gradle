apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def envProps = new Properties()
def envFile = new File(System.getProperty("user.home"), ".env")
if (envFile.exists()) {
    envFile.withInputStream { envProps.load(it) }
}
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def keystorePath = localProps.getProperty("STORE_FILE") ?: envProps.getProperty("KEYSTORE_FILE") ?: "${System.getProperty('user.home')}/Developer/PlayStore.jks"
def keystorePassword = localProps.getProperty("KEYSTORE_PASSWORD") ?: envProps.getProperty("KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
def keyAliasName = localProps.getProperty("KEY_ALIAS") ?: envProps.getProperty("KEY_ALIAS") ?: "key0"
def keyAliasPassword = localProps.getProperty("KEY_PASSWORD") ?: envProps.getProperty("KEY_PASSWORD") ?: keystorePassword

android {
    namespace "io.williamlagos.pomodorino"
    compileSdkVersion 36

    defaultConfig {
        applicationId "io.williamlagos.pomodorino"
        minSdkVersion 27
        targetSdkVersion 36
        versionCode 102
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (file(keystorePath).exists() && keystorePassword) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyAliasPassword
            }
        }
    }

    buildTypes {
        release {
            if (file(keystorePath).exists() && keystorePassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}